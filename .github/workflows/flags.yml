# Kill switches (memo B10): set one KV flag from the Actions tab (Actions → "Set a kill switch" → Run
# workflow). On a phone, use the phone's web browser at github.com; whether the GitHub Mobile app offers
# "Run workflow" is not confirmed by GitHub's docs [unverified]. The Worker reads `flag:<name>` from the
# FLAGS namespace (worker/src/lib/flags.ts). band_enabled is not offered: it stays false through
# Jan 31 2027 and the Worker ignores it anyway.
#
# Without Actions (memo §7.2 Z7: on GitHub Free a private repo stops running workflows once its 2,000
# monthly minutes are used): write the same KV keys yourself. With wrangler, from products/clb:
#   npx wrangler kv key put owner:grading_enabled false --binding FLAGS --remote -c worker/wrangler.jsonc
#   npx wrangler kv key put flag:grading_enabled false --binding FLAGS --remote -c worker/wrangler.jsonc
# (owner:<flag> first, only for free_enabled and grading_enabled; add --env staging for staging), or in the
# Cloudflare dashboard: Workers KV → the FLAGS namespace → add or edit the keys owner:<flag> and flag:<flag>
# with the value true or false [unverified: dashboard labels]. The Worker's own spend monitor runs on
# Cloudflare's cron and keeps working without Actions.
#
# Owner markers (integrator decision 12): setting free_enabled or grading_enabled also writes
# `owner:<flag>` = the same value. The Worker's spend monitor never turns a switch back on while its
# owner marker is 'false'. Turning grading_enabled off also records `pause:started_at` (ISO time, only
# if absent) so the pause is measured from this moment; when grading is back on, the cron extends
# active passes by the length of the pause and clears the marker (worker/src/cron.ts).
#
# Wrangler 4.137.0 flags checked with --help: kv key put <key> [value] --binding --remote,
# kv key get <key> --binding --remote --text, kv key delete <key> --binding --remote, -e/--env.
name: Set a kill switch

on:
  workflow_dispatch:
    inputs:
      flag:
        description: Switch to change
        required: true
        type: choice
        options:
          - checkout_enabled
          - grading_enabled
          - free_enabled
          - banner
      value:
        description: "true or false for the switches; for banner, the text to show (leave empty to remove it)"
        required: false
        type: string
        default: ''
      target:
        description: Which Worker (staging needs the env.staging ids in worker/wrangler.jsonc)
        required: false
        type: choice
        default: production
        options:
          - production
          - staging

permissions:
  contents: read

concurrency:
  group: flags
  cancel-in-progress: false

jobs:
  set-flag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: products/clb
    env:
      FLAG: ${{ inputs.flag }}
      RAW_VALUE: ${{ inputs.value }}
      TARGET: ${{ inputs.target }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate input
        id: input
        run: |
          case "$FLAG" in
            free_enabled|grading_enabled|checkout_enabled)
              value=$(printf '%s' "$RAW_VALUE" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
              if [ "$value" != true ] && [ "$value" != false ]; then
                echo "::error::$FLAG takes true or false (got '$RAW_VALUE')."
                exit 1
              fi
              ;;
            banner)
              value="$RAW_VALUE"
              if [ "$(printf '%s' "$value" | wc -l)" != 0 ]; then echo "::error::The banner must be one line."; exit 1; fi
              if [ "${#value}" -gt 200 ]; then echo "::error::The banner must be 200 characters or fewer."; exit 1; fi
              ;;
            *)
              echo "::error::Unknown or locked flag: $FLAG"
              exit 1
              ;;
          esac
          {
            echo "value<<__MPC_EOF__"
            printf '%s\n' "$value"
            echo "__MPC_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Check secrets
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Nothing changed: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/clb/package-lock.json

      - name: Install
        if: steps.cfg.outputs.ready == 'true'
        run: npm ci

      - name: Lint the banner text
        if: steps.cfg.outputs.ready == 'true' && inputs.flag == 'banner' && steps.input.outputs.value != ''
        env:
          VALUE: ${{ steps.input.outputs.value }}
        run: node scripts/run.mjs scripts/content-lint.ts --text "$VALUE"

      - name: Write the flag
        if: steps.cfg.outputs.ready == 'true'
        env:
          VALUE: ${{ steps.input.outputs.value }}
        run: |
          kv=(--binding FLAGS --remote -c worker/wrangler.jsonc)
          if [ "$TARGET" = staging ]; then kv+=(--env staging); fi
          key="flag:$FLAG"
          if [ "$FLAG" = banner ] && [ -z "$VALUE" ]; then
            npx wrangler kv key delete "$key" "${kv[@]}"
            echo "Removed the banner ($TARGET)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$FLAG" in
            free_enabled|grading_enabled)
              # the owner marker goes first: if the flag write then fails, nothing is re-enabled by mistake
              npx wrangler kv key put "owner:$FLAG" "$VALUE" "${kv[@]}"
              ;;
          esac
          if [ "$FLAG" = grading_enabled ] && [ "$VALUE" = false ]; then
            started=$(npx wrangler kv key get pause:started_at --text "${kv[@]}" 2>/dev/null | tail -n 1 || true)
            if printf '%s' "$started" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T'; then
              echo "A pause is already recorded (pause:started_at is set); keeping its start time."
            else
              npx wrangler kv key put pause:started_at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" "${kv[@]}"
            fi
          fi
          npx wrangler kv key put "$key" "$VALUE" "${kv[@]}"
          got=$(npx wrangler kv key get "$key" --text "${kv[@]}" 2>/dev/null | tail -n 1)
          if [ "$got" != "$VALUE" ]; then
            echo "::error::Read-back of $key did not match the value just written."
            exit 1
          fi
          {
            echo "Set \`$key\` to \`$VALUE\` on the $TARGET Worker at $(date -u +%Y-%m-%dT%H:%MZ)."
            echo ""
            echo "- Workers KV is eventually consistent, so other locations can take a short while to see the change [unverified: typical delay not measured here]."
            case "$FLAG" in
              free_enabled|grading_enabled)
                echo "- Also set the owner marker \`owner:$FLAG\` to \`$VALUE\`. While it is \`false\`, the Worker's 15-minute spend monitor never turns $FLAG back on; while it is \`true\`, the monitor may still turn $FLAG off when a spend tier is exceeded (worker/src/cron.ts)."
                ;;
            esac
            if [ "$FLAG" = grading_enabled ]; then
              echo "- Active passes are extended by the length of the pause: the cron measures it from \`pause:started_at\` and applies it after grading_enabled is true again."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
