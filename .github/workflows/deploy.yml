# Deploy of the practice coach Worker + static site (memo §5.2, B0, B11).
#
# production: pushes to master (and manual runs) when the repository variable MPC_DEPLOY is 'true'.
# staging:    same-repo pull requests (and manual runs with target=staging) when MPC_STAGING is 'true'.
#             The env.staging Worker in worker/wrangler.jsonc (own D1 and KV), at MPC_STAGING_SITE_URL,
#             with Stripe TEST keys (secrets STRIPE_TEST_SECRET_KEY, STRIPE_TEST_WEBHOOK_SECRET; a live
#             key is refused), Cloudflare's always-pass Turnstile test keys, the eval Anthropic key when
#             present, no analytics or ads tag, a robots.txt that disallows crawling, and a random
#             HASH_SALT on its first deploy. Pull requests from forks never deploy (no secrets).
#
# Steps: secrets present? → install → configuration check (scripts/deploy-config.ts: production
# refuses to run without MPC_MAILING_ADDRESS) → tests (production) → site build (public env from
# repository variables) → content lint (production: --require-address fails on the address
# placeholder) → IndexNow key file (production) → note the live Worker version → D1 migrations →
# deploy with secrets, vars and the custom domain → smoke test (scripts/smoke.ts: /api/health with
# this commit's version, key pages, /api/me shape) → on smoke failure `wrangler rollback` to the noted
# version and fail → production: IndexNow ping (never fails the deploy). D1 migrations are never
# rolled back.
#
# Worker vars from repository variables: SITE_URL, FROM_EMAIL, MAILING_ADDRESS, OWNER_EMAIL,
# GRADER_MODEL, GRADER_EFFORT, GRADER_MAX_TOKENS (MPC_*), and ANTHROPIC_MONTHLY_LIMIT_USD from
# ops/config/anthropic-limit.json (the limit set in the Anthropic Console; a merged raise redeploys).
# Custom domain: when the site URL is not *.workers.dev, `--domain <host>` attaches it (the API token
# needs the permissions listed in business/online/owner-setup.md).
#
# Wrangler 4.137.0 flags checked with --help: deploy --secrets-file --var KEY:VALUE --message
# --domain/--domains; -e/--env (global; --env= selects the top level); deployments status --json;
# d1 migrations apply <db> --remote; rollback [version-id] -y --message.
name: Deploy practice coach

on:
  push:
    branches: [master]
    paths:
      - 'products/clb/**'
      - 'ops/config/anthropic-limit.json'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'products/clb/**'
      - 'ops/config/anthropic-limit.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Which Worker to deploy
        required: false
        type: choice
        default: production
        options:
          - production
          - staging

permissions:
  contents: read

concurrency:
  group: deploy-clb-${{ (github.event_name == 'pull_request' || inputs.target == 'staging') && 'staging' || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'pull_request' && vars.MPC_STAGING == 'true' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && inputs.target == 'staging' && vars.MPC_STAGING == 'true') ||
      (github.event_name != 'pull_request' && inputs.target != 'staging' && vars.MPC_DEPLOY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: products/clb
    env:
      TARGET: ${{ (github.event_name == 'pull_request' || inputs.target == 'staging') && 'staging' || 'production' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MPC_SITE_URL: ${{ vars.MPC_SITE_URL }}
      MPC_STAGING_SITE_URL: ${{ vars.MPC_STAGING_SITE_URL }}
      MPC_MAILING_ADDRESS: ${{ vars.MPC_MAILING_ADDRESS }}
      MPC_FROM_EMAIL: ${{ vars.MPC_FROM_EMAIL }}
      MPC_OWNER_EMAIL: ${{ vars.MPC_OWNER_EMAIL }}
      MPC_GRADER_MODEL: ${{ vars.MPC_GRADER_MODEL }}
      MPC_GRADER_EFFORT: ${{ vars.MPC_GRADER_EFFORT }}
      MPC_GRADER_MAX_TOKENS: ${{ vars.MPC_GRADER_MAX_TOKENS }}
      MPC_TURNSTILE_SITE_KEY: ${{ vars.MPC_TURNSTILE_SITE_KEY }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check secrets and select the target
        id: secrets
        run: |
          # Contact details are repository variables, not secrets: mask them so logs never show them.
          for v in "$MPC_OWNER_EMAIL" "$MPC_FROM_EMAIL" "$MPC_MAILING_ADDRESS"; do
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Deploy ($TARGET) skipped: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (business/online/owner-setup.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$TARGET" = staging ]; then
            site="$MPC_STAGING_SITE_URL"; env_flag="--env=staging"
          else
            site="$MPC_SITE_URL"; env_flag="--env="
          fi
          {
            echo "SITE_URL=${site%/}"
            echo "WRANGLER_ENV_FLAG=$env_flag"
          } >> "$GITHUB_ENV"
          echo "Target: $TARGET"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/clb/package-lock.json

      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci

      - name: Check configuration
        id: cfg
        if: steps.secrets.outputs.ready == 'true'
        env:
          MAILING_ADDRESS: ${{ vars.MPC_MAILING_ADDRESS }}
          GRADER_MODEL: ${{ vars.MPC_GRADER_MODEL }}
          GRADER_EFFORT: ${{ vars.MPC_GRADER_EFFORT }}
          GRADER_MAX_TOKENS: ${{ vars.MPC_GRADER_MAX_TOKENS }}
          TURNSTILE_SITE_KEY: ${{ vars.MPC_TURNSTILE_SITE_KEY }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: |
          # only the key's prefix is inspected; the key itself is never printed
          STRIPE_KEY_MODE=""
          if [ "$TARGET" = staging ]; then
            case "$STRIPE_TEST_SECRET_KEY" in
              sk_live_*|rk_live_*) STRIPE_KEY_MODE='live' ;;
              sk_test_*|rk_test_*) STRIPE_KEY_MODE='test' ;;
            esac
          fi
          export STRIPE_KEY_MODE
          unset STRIPE_TEST_SECRET_KEY
          node scripts/run.mjs scripts/deploy-config.ts check --target "$TARGET"

      - name: Typecheck and test
        if: steps.secrets.outputs.ready == 'true' && env.TARGET == 'production'
        run: |
          npm run typecheck
          npx vitest run

      - name: Build site
        if: steps.secrets.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_MAILING_ADDRESS: ${{ vars.MPC_MAILING_ADDRESS }}
          NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.MPC_SUPPORT_EMAIL }}
          PROD_TURNSTILE_SITE_KEY: ${{ vars.MPC_TURNSTILE_SITE_KEY }}
          PROD_CF_BEACON_TOKEN: ${{ vars.MPC_CF_BEACON_TOKEN }}
          PROD_GADS_SEND_TO: ${{ vars.MPC_GADS_SEND_TO }}
        run: |
          export NEXT_PUBLIC_SITE_URL="$SITE_URL"
          # staging: Turnstile test key, no Web Analytics, no ads conversion tag
          if [ "$TARGET" = production ]; then
            export NEXT_PUBLIC_TURNSTILE_SITE_KEY="$PROD_TURNSTILE_SITE_KEY"
            export NEXT_PUBLIC_CF_BEACON_TOKEN="$PROD_CF_BEACON_TOKEN"
            export NEXT_PUBLIC_GADS_SEND_TO="$PROD_GADS_SEND_TO"
          fi
          # unset variables arrive as empty strings; drop them so the site's safe defaults apply
          for v in NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_MAILING_ADDRESS NEXT_PUBLIC_TURNSTILE_SITE_KEY NEXT_PUBLIC_CF_BEACON_TOKEN NEXT_PUBLIC_GADS_SEND_TO NEXT_PUBLIC_SUPPORT_EMAIL; do
            if [ -z "${!v:-}" ]; then unset "$v"; fi
          done
          npm run build
          if [ "$TARGET" = staging ]; then
            printf 'User-agent: *\nDisallow: /\n' > out/robots.txt
          fi

      - name: Content lint
        if: steps.secrets.outputs.ready == 'true'
        run: |
          args=(--out out --ads ../../ops/ads/google.csv)
          # production: fail when a page still shows the mailing-address placeholder (decision 16)
          if [ "$TARGET" = production ]; then args+=(--require-address); fi
          node scripts/run.mjs scripts/content-lint.ts "${args[@]}"

      # The IndexNow key is the repository variable MPC_INDEXNOW_KEY (not a secret: search engines read
      # it from the site). The key file is generated here into the export, never committed.
      - name: IndexNow key file
        if: steps.secrets.outputs.ready == 'true' && env.TARGET == 'production'
        env:
          INDEXNOW_KEY: ${{ vars.MPC_INDEXNOW_KEY }}
        run: node scripts/run.mjs scripts/indexnow.ts write-key --out out

      - name: Note the live Worker version
        id: prev
        if: steps.secrets.outputs.ready == 'true'
        run: |
          prev=""
          if out=$(npx wrangler deployments status --json -c worker/wrangler.jsonc "$WRANGLER_ENV_FLAG" 2>/dev/null); then
            prev=$(printf '%s' "$out" | node -e '
              let s = ""
              process.stdin.on("data", (d) => (s += d)).on("end", () => {
                try {
                  const j = JSON.parse(s.slice(s.search(/[{[]/)))
                  const v = (j.versions || []).find((x) => x.percentage === 100)
                  console.log(v ? v.version_id : "")
                } catch { console.log("") }
              })')
          fi
          echo "version=$prev" >> "$GITHUB_OUTPUT"
          echo "Live $TARGET version before deploy: ${prev:-none (first deploy)}"

      - name: Apply D1 migrations
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote -c worker/wrangler.jsonc "$WRANGLER_ENV_FLAG"

      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        env:
          PREV_VERSION: ${{ steps.prev.outputs.version }}
          DOMAIN: ${{ steps.cfg.outputs.domain }}
          ANTHROPIC_LIMIT_USD: ${{ steps.cfg.outputs.anthropic_limit_usd }}
          SECRET_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SECRET_ANTHROPIC_EVAL_API_KEY: ${{ secrets.ANTHROPIC_EVAL_API_KEY }}
          SECRET_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SECRET_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SECRET_STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          SECRET_STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          SECRET_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SECRET_TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          SECRET_HASH_SALT: ${{ secrets.HASH_SALT }}
        run: |
          suffix=""
          if [ "$TARGET" = staging ]; then suffix="-staging"; fi
          app_version="$(node -p 'require("./package.json").version')${suffix}+${GITHUB_SHA::7}"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"

          # Worker secrets from GitHub secrets, written to a private temp file and deleted afterwards.
          # Secrets that are not set keep their current value on the Worker (--secrets-file is additive).
          umask 077
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          if [ "$TARGET" = staging ] && [ -z "$PREV_VERSION" ]; then
            # first staging deploy: a salt of its own, so staging hashes never match production ones
            SECRET_HASH_SALT="$(openssl rand -hex 32)"
            echo "::add-mask::$SECRET_HASH_SALT"
            export SECRET_HASH_SALT
          fi
          node -e '
            const staging = process.env.TARGET === "staging"
            const e = (n) => process.env["SECRET_" + n] || ""
            const pick = {
              ANTHROPIC_API_KEY: staging ? e("ANTHROPIC_EVAL_API_KEY") || e("ANTHROPIC_API_KEY") : e("ANTHROPIC_API_KEY"),
              STRIPE_SECRET_KEY: staging ? e("STRIPE_TEST_SECRET_KEY") : e("STRIPE_SECRET_KEY"),
              STRIPE_WEBHOOK_SECRET: staging ? e("STRIPE_TEST_WEBHOOK_SECRET") : e("STRIPE_WEBHOOK_SECRET"),
              RESEND_API_KEY: e("RESEND_API_KEY"),
              // Cloudflare documented always-pass test secret (turnstile/troubleshooting/testing.mdx)
              TURNSTILE_SECRET: staging ? "1x0000000000000000000000000000000AA" : e("TURNSTILE_SECRET"),
              // staging keeps the salt of its first deploy; production takes the HASH_SALT secret
              HASH_SALT: staging ? (process.env.PREV_VERSION ? "" : e("HASH_SALT")) : e("HASH_SALT"),
            }
            if (staging && pick.STRIPE_SECRET_KEY && !/^(sk|rk)_test_/.test(pick.STRIPE_SECRET_KEY)) {
              console.log("::error::staging only takes Stripe test keys")
              process.exit(1)
            }
            const out = {}
            const missing = []
            for (const [n, v] of Object.entries(pick)) {
              if (v) out[n] = v
              else if (!(staging && n === "HASH_SALT")) missing.push(n)
            }
            require("fs").writeFileSync(process.argv[1], JSON.stringify(out), { mode: 0o600 })
            console.log("Worker secrets sent with this deploy: " + (Object.keys(out).join(", ") || "none"))
            if (missing.length) console.log("::warning::Not in GitHub secrets (the Worker keeps any value it already has): " + missing.join(", "))
            if (staging && !e("ANTHROPIC_EVAL_API_KEY") && e("ANTHROPIC_API_KEY")) console.log("::warning::Staging grades with the production ANTHROPIC_API_KEY; add ANTHROPIC_EVAL_API_KEY so staging spend stays out of the production Console limit.")
          ' "$secrets_file"
          if [ -z "$SECRET_HASH_SALT" ] && [ -z "$PREV_VERSION" ]; then
            echo "::error::First deploy needs the HASH_SALT secret (sessions and hashed ids depend on it)."
            exit 1
          fi

          args=(-c worker/wrangler.jsonc "$WRANGLER_ENV_FLAG" --message "GitHub Actions $TARGET deploy ${GITHUB_SHA::7}" --var "APP_VERSION:$app_version")
          if [ "$(node -p 'Object.keys(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))).length' "$secrets_file")" != 0 ]; then
            args+=(--secrets-file "$secrets_file")
          fi
          args+=(--var "SITE_URL:$SITE_URL")
          if [ -n "$MPC_FROM_EMAIL" ]; then args+=(--var "FROM_EMAIL:$MPC_FROM_EMAIL"); fi
          if [ -n "$MPC_MAILING_ADDRESS" ]; then args+=(--var "MAILING_ADDRESS:$MPC_MAILING_ADDRESS"); fi
          if [ -n "$MPC_OWNER_EMAIL" ]; then args+=(--var "OWNER_EMAIL:$MPC_OWNER_EMAIL"); fi
          if [ -n "$MPC_GRADER_MODEL" ]; then args+=(--var "GRADER_MODEL:$MPC_GRADER_MODEL"); fi
          if [ -n "$MPC_GRADER_EFFORT" ]; then args+=(--var "GRADER_EFFORT:$MPC_GRADER_EFFORT"); fi
          if [ -n "$MPC_GRADER_MAX_TOKENS" ]; then args+=(--var "GRADER_MAX_TOKENS:$MPC_GRADER_MAX_TOKENS"); fi
          if [ -n "$ANTHROPIC_LIMIT_USD" ]; then args+=(--var "ANTHROPIC_MONTHLY_LIMIT_USD:$ANTHROPIC_LIMIT_USD"); fi
          if [ -n "$DOMAIN" ]; then args+=(--domain "$DOMAIN"); fi
          npx wrangler deploy "${args[@]}"

      - name: Smoke test
        id: smoke
        if: steps.secrets.outputs.ready == 'true'
        env:
          APP_VERSION: ${{ steps.deploy.outputs.app_version }}
        # the new version can take a little while to reach every location
        run: node scripts/run.mjs scripts/smoke.ts --base "$SITE_URL" --version "$APP_VERSION" --wait-seconds 120

      - name: Roll back after a failed smoke test
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          PREV_VERSION: ${{ steps.prev.outputs.version }}
        run: |
          if [ -z "$PREV_VERSION" ]; then
            echo "::error::Smoke test failed on the first $TARGET deploy; there is no earlier Worker version to roll back to."
            exit 1
          fi
          npx wrangler rollback "$PREV_VERSION" -y --message "Smoke test failed for ${GITHUB_SHA::7}" -c worker/wrangler.jsonc "$WRANGLER_ENV_FLAG"
          echo "::error::Smoke test failed. Rolled back the $TARGET Worker to version $PREV_VERSION. D1 migrations are not rolled back."
          echo "Rolled back $TARGET to $PREV_VERSION after a failed smoke test (D1 migrations stay applied)." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: IndexNow ping (never fails the deploy)
        if: steps.smoke.outcome == 'success' && env.TARGET == 'production'
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ vars.MPC_INDEXNOW_KEY }}
        run: node scripts/run.mjs scripts/indexnow.ts ping --site "$SITE_URL" --sitemap out/sitemap.xml
