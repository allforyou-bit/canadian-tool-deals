# Deploy of the practice coach Worker + static site (memo §5.2, B0, B11; zero-capital launch memo §7.2).
#
# production: pushes to master (and manual runs) when the repository variable MPC_DEPLOY is 'true'.
# staging:    manual runs with target=staging only (memo §7.2 Z7: no pull-request trigger, to save Actions
#             minutes). The env.staging Worker in worker/wrangler.jsonc (own D1 and KV), at MPC_STAGING_SITE_URL,
#             on a public workers.dev host, so it is LOCKED (memo §7.1 B11 / level B):
#             - STAGING_ALLOWED_EMAILS = MPC_STAGING_ALLOWED_EMAILS, else MPC_OWNER_EMAIL (the deploy is
#               refused when both are empty): sign-in goes only to those addresses and anonymous
#               grading is off (worker/src/auth.ts stagingAllows). Never set for production.
#             - the Anthropic key is ANTHROPIC_EVAL_API_KEY only, never the production key; without it a
#               placeholder key is sent and every staging grade fails (a warning says so).
#             - ANTHROPIC_MONTHLY_LIMIT_USD = evalMonthlyLimitUsd (ops/config/anthropic-limit.json); no
#               prepaid-credit ledger (the credits are the organization's; staging sees only its own spend).
#             - FROM_EMAIL gets a "STAGING - " prefix; it reuses RESEND_API_KEY, which is safe because only
#               the owner's address receives mail (LEARNER_EMAIL=off, Resend's sandbox sender).
#             - Stripe TEST keys only (secrets STRIPE_TEST_SECRET_KEY, STRIPE_TEST_WEBHOOK_SECRET; a live
#               key is refused), Cloudflare's Turnstile TEST keys (safe only behind the allowlist, see
#               the Deploy step), no analytics tag, a robots.txt that disallows crawling, and a random
#               HASH_SALT on its first deploy. Google sign-in when configured (same OAuth client; its
#               redirect URI must list the staging address too).
#
# Steps: secrets present? → install → configuration check (scripts/deploy-config.ts: production refuses to
# run without MPC_LEGAL_NAME, without Google sign-in (MPC_GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET), without
# MPC_OWNER_EMAIL, or without a real Turnstile site key + TURNSTILE_SECRET; MPC_MAILING_ADDRESS is optional;
# staging refuses without an allowlist) → tests (production) → site build (public env from repository
# variables) → content lint (--require-legal-name when a legal name is set; --require-address only when
# MPC_MAILING_ADDRESS is set) → IndexNow key file (production; MPC_INDEXNOW_KEY or a key derived from the
# site URL) → note the live Worker version → D1 migrations → deploy with secrets, vars and the custom domain
# → verification that does not depend on the Deploy step's exit code (wrangler makes the new version live
# BEFORE it attaches routes, custom domains and crons, so a failed Deploy step can leave new code serving):
#   - smoke test (scripts/smoke.ts: /api/health with this commit's version, key pages, /api/me shape and
#     the sign-in methods this deploy configured) whenever `wrangler deploy` was started, whether the Deploy
#     step succeeded or failed;
#   - when the Deploy step or the smoke test failed: read the live version again and, if it is not the
#     one noted before the deploy, `wrangler rollback` to that one; the job fails naming the failed step.
# → production: IndexNow ping (never fails the deploy). D1 migrations are never rolled back.
#
# Worker vars (all passed explicitly): SITE_URL, FROM_EMAIL (MPC_FROM_EMAIL, else Resend's sandbox sender
# 'Maple Practice Coach <onboarding@resend.dev>', memo §7.2 Z4), OWNER_EMAIL, LEGAL_NAME (MPC_LEGAL_NAME),
# MAILING_ADDRESS (when set), GOOGLE_CLIENT_ID (MPC_GOOGLE_CLIENT_ID, only together with the
# GOOGLE_CLIENT_SECRET secret), MAGIC_LINK (MPC_MAGIC_LINK, else 'owner') and LEARNER_EMAIL
# (MPC_LEARNER_EMAIL, else 'off'), GRADER_MODEL, GRADER_EFFORT, GRADER_MAX_TOKENS (MPC_*),
# STAGING_ALLOWED_EMAILS (staging only), ANTHROPIC_MONTHLY_LIMIT_USD from ops/config/anthropic-limit.json
# (production: monthlyLimitUsd; staging: evalMonthlyLimitUsd; a merged change redeploys) and, on production,
# ANTHROPIC_PREPAID_USD / ANTHROPIC_PREPAID_SINCE (prepaidUsd / prepaidSince, only when both are valid).
# Custom domain: when the site URL is not *.workers.dev, `--domain <host>` attaches it (the API token
# needs the permissions listed in business/online/owner-setup.md). The zero-capital launch uses workers.dev.
#
# Wrangler 4.137.0 flags checked with --help: deploy --secrets-file --var KEY:VALUE --message
# --domain/--domains; -e/--env (global; --env= selects the top level); deployments status --json;
# d1 migrations apply <db> --remote; rollback [version-id] -y/--yes -m/--message. `--var` values are
# merged over the config's vars (wrangler-dist/cli.js: cliVars override getBindings(config); KEY:VALUE is
# split at the first colon), and without --keep-vars every var not in the config or on the command line
# is removed.
name: Deploy practice coach

on:
  push:
    branches: [master]
    paths:
      - 'products/clb/**'
      # not deployed: docs, the eval harness and the browser tests
      - '!products/clb/**/*.md'
      - '!products/clb/scripts/eval/**'
      - '!products/clb/e2e/**'
      - 'ops/config/anthropic-limit.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Which Worker to deploy
        required: false
        type: choice
        default: production
        options:
          - production
          - staging
      rollback_drill:
        description: 'Staging only: after deploying, fail the smoke test on purpose so the rollback path runs (level-B check for B11)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-clb-${{ inputs.target == 'staging' && 'staging' || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    # a staging run is always started by hand, which is its own opt-in; production needs MPC_DEPLOY
    if: inputs.target == 'staging' || vars.MPC_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: products/clb
    env:
      TARGET: ${{ inputs.target == 'staging' && 'staging' || 'production' }}
      DRILL: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_drill && 'true' || 'false' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MPC_SITE_URL: ${{ vars.MPC_SITE_URL }}
      MPC_STAGING_SITE_URL: ${{ vars.MPC_STAGING_SITE_URL }}
      MPC_LEGAL_NAME: ${{ vars.MPC_LEGAL_NAME }}
      MPC_MAILING_ADDRESS: ${{ vars.MPC_MAILING_ADDRESS }}
      MPC_FROM_EMAIL: ${{ vars.MPC_FROM_EMAIL }}
      MPC_OWNER_EMAIL: ${{ vars.MPC_OWNER_EMAIL }}
      MPC_STAGING_ALLOWED_EMAILS: ${{ vars.MPC_STAGING_ALLOWED_EMAILS }}
      MPC_GRADER_MODEL: ${{ vars.MPC_GRADER_MODEL }}
      MPC_GRADER_EFFORT: ${{ vars.MPC_GRADER_EFFORT }}
      MPC_GRADER_MAX_TOKENS: ${{ vars.MPC_GRADER_MAX_TOKENS }}
      MPC_TURNSTILE_SITE_KEY: ${{ vars.MPC_TURNSTILE_SITE_KEY }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Refuse a rollback drill outside staging
        if: env.DRILL == 'true' && env.TARGET != 'staging'
        run: |
          echo "::error::The rollback drill only runs on staging (choose target=staging)."
          exit 1

      - name: Check secrets and select the target
        id: secrets
        run: |
          # Contact details and the owner's legal name are repository variables, not secrets: mask them so
          # logs never show them (each staging allowlist entry on its own, since the Worker gets them as one list).
          IFS=',' read -r -a allowlist <<< "$MPC_STAGING_ALLOWED_EMAILS"
          for v in "$MPC_OWNER_EMAIL" "$MPC_FROM_EMAIL" "$MPC_MAILING_ADDRESS" "$MPC_LEGAL_NAME" "$MPC_STAGING_ALLOWED_EMAILS" "${allowlist[@]}"; do
            v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"
            if [ -n "$v" ]; then echo "::add-mask::$v"; fi
          done
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Deploy ($TARGET) skipped: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (business/online/owner-setup.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$TARGET" = staging ]; then
            site="$MPC_STAGING_SITE_URL"; env_flag="--env=staging"
          else
            site="$MPC_SITE_URL"; env_flag="--env="
          fi
          {
            echo "SITE_URL=${site%/}"
            echo "WRANGLER_ENV_FLAG=$env_flag"
          } >> "$GITHUB_ENV"
          echo "Target: $TARGET"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/clb/package-lock.json

      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci

      - name: Check configuration
        id: cfg
        if: steps.secrets.outputs.ready == 'true'
        env:
          LEGAL_NAME: ${{ vars.MPC_LEGAL_NAME }}
          MAILING_ADDRESS: ${{ vars.MPC_MAILING_ADDRESS }}
          GOOGLE_CLIENT_ID: ${{ vars.MPC_GOOGLE_CLIENT_ID }}
          MAGIC_LINK: ${{ vars.MPC_MAGIC_LINK }}
          LEARNER_EMAIL: ${{ vars.MPC_LEARNER_EMAIL }}
          GRADER_MODEL: ${{ vars.MPC_GRADER_MODEL }}
          GRADER_EFFORT: ${{ vars.MPC_GRADER_EFFORT }}
          GRADER_MAX_TOKENS: ${{ vars.MPC_GRADER_MAX_TOKENS }}
          TURNSTILE_SITE_KEY: ${{ vars.MPC_TURNSTILE_SITE_KEY }}
          FROM_EMAIL: ${{ vars.MPC_FROM_EMAIL }}
          OWNER_EMAIL: ${{ vars.MPC_OWNER_EMAIL }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          # only the secrets' shape is inspected; the values themselves are never printed
          GOOGLE_SECRET_MODE=""
          if [ -n "$GOOGLE_CLIENT_SECRET" ]; then GOOGLE_SECRET_MODE='set'; fi
          STRIPE_KEY_MODE=""
          if [ "$TARGET" = staging ]; then
            case "$STRIPE_TEST_SECRET_KEY" in
              sk_live_*|rk_live_*) STRIPE_KEY_MODE='live' ;;
              sk_test_*|rk_test_*) STRIPE_KEY_MODE='test' ;;
            esac
          fi
          # Cloudflare's documented test secrets (turnstile/troubleshooting/testing.mdx) are refused in production
          case "$TURNSTILE_SECRET" in
            '') TURNSTILE_SECRET_MODE='' ;;
            [123]x0000000000000000000000000000000AA) TURNSTILE_SECRET_MODE='test' ;;
            *) TURNSTILE_SECRET_MODE='set' ;;
          esac
          export STRIPE_KEY_MODE TURNSTILE_SECRET_MODE GOOGLE_SECRET_MODE
          unset STRIPE_TEST_SECRET_KEY TURNSTILE_SECRET GOOGLE_CLIENT_SECRET
          node scripts/run.mjs scripts/deploy-config.ts check --target "$TARGET"

      - name: Typecheck and test
        if: steps.secrets.outputs.ready == 'true' && env.TARGET == 'production'
        run: |
          npm run typecheck
          npx vitest run

      - name: Build site
        if: steps.secrets.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_LEGAL_NAME: ${{ steps.cfg.outputs.legal_name }}
          NEXT_PUBLIC_MAILING_ADDRESS: ${{ vars.MPC_MAILING_ADDRESS }}
          NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.MPC_SUPPORT_EMAIL }}
          PROD_TURNSTILE_SITE_KEY: ${{ vars.MPC_TURNSTILE_SITE_KEY }}
          PROD_CF_BEACON_TOKEN: ${{ vars.MPC_CF_BEACON_TOKEN }}
        run: |
          export NEXT_PUBLIC_SITE_URL="$SITE_URL"
          # staging: Turnstile test key, no Web Analytics (there is no ads tag any more, memo §7.2 Z1)
          if [ "$TARGET" = production ]; then
            export NEXT_PUBLIC_TURNSTILE_SITE_KEY="$PROD_TURNSTILE_SITE_KEY"
            export NEXT_PUBLIC_CF_BEACON_TOKEN="$PROD_CF_BEACON_TOKEN"
          fi
          # unset variables arrive as empty strings; drop them so the site's safe defaults apply
          for v in NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_LEGAL_NAME NEXT_PUBLIC_MAILING_ADDRESS NEXT_PUBLIC_TURNSTILE_SITE_KEY NEXT_PUBLIC_CF_BEACON_TOKEN NEXT_PUBLIC_SUPPORT_EMAIL; do
            if [ -z "${!v:-}" ]; then unset "$v"; fi
          done
          npm run build
          if [ "$TARGET" = staging ]; then
            printf 'User-agent: *\nDisallow: /\n' > out/robots.txt
          fi

      - name: Content lint
        if: steps.secrets.outputs.ready == 'true'
        env:
          LEGAL_NAME: ${{ steps.cfg.outputs.legal_name }}
          REQUIRE_ADDRESS: ${{ steps.cfg.outputs.require_address }}
        run: |
          args=(--out out)
          # memo §7.2 Z5: the seller's legal name must be on the terms and privacy pages (production always
          # has one; deploy-config.ts refused it otherwise), and a mailing address, when one is set, must
          # have reached the pages instead of the placeholder
          if [ -n "$LEGAL_NAME" ]; then args+=(--require-legal-name); fi
          if [ "$REQUIRE_ADDRESS" = true ]; then args+=(--require-address); fi
          node scripts/run.mjs scripts/content-lint.ts "${args[@]}"

      # The IndexNow key is the repository variable MPC_INDEXNOW_KEY, or, when it is unset, a key derived
      # from the site URL (memo §7.2 Z10; not a secret: search engines read it from the site). The key file
      # is generated here into the export, never committed.
      - name: IndexNow key file
        if: steps.secrets.outputs.ready == 'true' && env.TARGET == 'production'
        env:
          INDEXNOW_KEY: ${{ vars.MPC_INDEXNOW_KEY }}
        run: node scripts/run.mjs scripts/indexnow.ts write-key --out out --site "$SITE_URL"

      - name: Note the live Worker version
        id: prev
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # the version serving 100% of traffic ('' on a first deploy); parsing: scripts/deploy-config.ts
          prev=""
          if out=$(npx wrangler deployments status --json -c worker/wrangler.jsonc "$WRANGLER_ENV_FLAG" 2>/dev/null); then
            prev=$(printf '%s' "$out" | node scripts/run.mjs scripts/deploy-config.ts live-version)
          fi
          echo "version=$prev" >> "$GITHUB_OUTPUT"
          echo "Live $TARGET version before deploy: ${prev:-none (first deploy)}"

      - name: Apply D1 migrations
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote -c worker/wrangler.jsonc "$WRANGLER_ENV_FLAG"

      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        env:
          PREV_VERSION: ${{ steps.prev.outputs.version }}
          DOMAIN: ${{ steps.cfg.outputs.domain }}
          ANTHROPIC_LIMIT_USD: ${{ steps.cfg.outputs.anthropic_limit_usd }}
          PREPAID_USD: ${{ steps.cfg.outputs.prepaid_usd }}
          PREPAID_SINCE: ${{ steps.cfg.outputs.prepaid_since }}
          STAGING_ALLOWED_EMAILS: ${{ steps.cfg.outputs.staging_allowed_emails }}
          FROM_EMAIL: ${{ steps.cfg.outputs.from_email }}
          LEGAL_NAME: ${{ steps.cfg.outputs.legal_name }}
          GOOGLE_CLIENT_ID: ${{ steps.cfg.outputs.google_client_id }}
          MAGIC_LINK: ${{ steps.cfg.outputs.magic_link }}
          LEARNER_EMAIL: ${{ steps.cfg.outputs.learner_email }}
          # production-only and staging-only secrets are not even handed to the other target's step
          SECRET_ANTHROPIC_API_KEY: ${{ env.TARGET == 'production' && secrets.ANTHROPIC_API_KEY || '' }}
          SECRET_ANTHROPIC_EVAL_API_KEY: ${{ env.TARGET == 'staging' && secrets.ANTHROPIC_EVAL_API_KEY || '' }}
          SECRET_STRIPE_SECRET_KEY: ${{ env.TARGET == 'production' && secrets.STRIPE_SECRET_KEY || '' }}
          SECRET_STRIPE_WEBHOOK_SECRET: ${{ env.TARGET == 'production' && secrets.STRIPE_WEBHOOK_SECRET || '' }}
          SECRET_STRIPE_TEST_SECRET_KEY: ${{ env.TARGET == 'staging' && secrets.STRIPE_TEST_SECRET_KEY || '' }}
          SECRET_STRIPE_TEST_WEBHOOK_SECRET: ${{ env.TARGET == 'staging' && secrets.STRIPE_TEST_WEBHOOK_SECRET || '' }}
          SECRET_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SECRET_TURNSTILE_SECRET: ${{ env.TARGET == 'production' && secrets.TURNSTILE_SECRET || '' }}
          SECRET_HASH_SALT: ${{ secrets.HASH_SALT }}
          SECRET_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          suffix=""
          if [ "$TARGET" = staging ]; then suffix="-staging"; fi
          app_version="$(node -p 'require("./package.json").version')${suffix}+${GITHUB_SHA::7}"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"

          # Worker secrets from GitHub secrets, written to a private temp file and deleted afterwards.
          # Secrets that are not set keep their current value on the Worker (--secrets-file is additive).
          umask 077
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          if [ "$TARGET" = staging ] && [ -z "$PREV_VERSION" ]; then
            # first staging deploy: a salt of its own, so staging hashes never match production ones
            SECRET_HASH_SALT="$(openssl rand -hex 32)"
            echo "::add-mask::$SECRET_HASH_SALT"
            export SECRET_HASH_SALT
          fi
          node -e '
            const staging = process.env.TARGET === "staging"
            const e = (n) => process.env["SECRET_" + n] || ""
            const pick = {
              // Staging NEVER gets the production key: the eval workspace key, or a placeholder that the
              // Anthropic API rejects (it also replaces any older value, as --secrets-file is additive).
              ANTHROPIC_API_KEY: staging ? e("ANTHROPIC_EVAL_API_KEY") || "staging-without-ANTHROPIC_EVAL_API_KEY" : e("ANTHROPIC_API_KEY"),
              STRIPE_SECRET_KEY: staging ? e("STRIPE_TEST_SECRET_KEY") : e("STRIPE_SECRET_KEY"),
              STRIPE_WEBHOOK_SECRET: staging ? e("STRIPE_TEST_WEBHOOK_SECRET") : e("STRIPE_WEBHOOK_SECRET"),
              // staging reuses the production Resend key: STAGING_ALLOWED_EMAILS limits its sign-in links to
              // the owner addresses, LEARNER_EMAIL=off sends nothing to anyone else, and the Resend sandbox
              // sender delivers only to the address of the Resend account itself (memo §7.2 Z4)
              RESEND_API_KEY: e("RESEND_API_KEY"),
              // Staging: the Cloudflare always-pass TEST secret (turnstile/troubleshooting/testing.mdx), which
              // accepts the public dummy token XXXX.DUMMY.TOKEN.XXXX, so Turnstile stops nobody there. That is
              // acceptable only because staging is always deployed with STAGING_ALLOWED_EMAILS (below): sign-in
              // links go to the owner addresses only and anonymous grading is off, so getting past Turnstile
              // cannot send mail to strangers or spend model credit. The site is built with the test site key.
              // Production: the real secret (deploy-config.ts refuses production without it).
              TURNSTILE_SECRET: staging ? "1x0000000000000000000000000000000AA" : e("TURNSTILE_SECRET"),
              // staging keeps the salt of its first deploy; production takes the HASH_SALT secret
              HASH_SALT: staging ? (process.env.PREV_VERSION ? "" : e("HASH_SALT")) : e("HASH_SALT"),
              // only together with GOOGLE_CLIENT_ID (deploy-config.ts passes the id only when this secret is set)
              GOOGLE_CLIENT_SECRET: process.env.GOOGLE_CLIENT_ID ? e("GOOGLE_CLIENT_SECRET") : "",
            }
            if (staging && pick.STRIPE_SECRET_KEY && !/^(sk|rk)_test_/.test(pick.STRIPE_SECRET_KEY)) {
              console.log("::error::staging only takes Stripe test keys")
              process.exit(1)
            }
            const out = {}
            const missing = []
            for (const [n, v] of Object.entries(pick)) {
              if (v) out[n] = v
              else if (!(staging && n === "HASH_SALT") && n !== "GOOGLE_CLIENT_SECRET") missing.push(n)
            }
            require("fs").writeFileSync(process.argv[1], JSON.stringify(out), { mode: 0o600 })
            console.log("Worker secrets sent with this deploy: " + (Object.keys(out).join(", ") || "none"))
            if (missing.length) console.log("::warning::Not in GitHub secrets (the Worker keeps any value it already has): " + missing.join(", "))
            if (staging && !e("ANTHROPIC_EVAL_API_KEY")) console.log("::warning::Staging is deployed with a PLACEHOLDER Anthropic key, so every grade on staging will fail. Add the ANTHROPIC_EVAL_API_KEY secret (eval workspace) and deploy staging again; staging never uses the production ANTHROPIC_API_KEY.")
          ' "$secrets_file"
          if [ -z "$SECRET_HASH_SALT" ] && [ -z "$PREV_VERSION" ]; then
            echo "::error::First deploy needs the HASH_SALT secret (sessions and hashed ids depend on it)."
            exit 1
          fi

          args=(-c worker/wrangler.jsonc "$WRANGLER_ENV_FLAG" --message "GitHub Actions $TARGET deploy ${GITHUB_SHA::7}" --var "APP_VERSION:$app_version")
          if [ "$(node -p 'Object.keys(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))).length' "$secrets_file")" != 0 ]; then
            args+=(--secrets-file "$secrets_file")
          fi
          args+=(--var "SITE_URL:$SITE_URL")
          if [ "$TARGET" = staging ]; then
            # the staging lock (see the header); deploy-config.ts already refused an empty list
            if [ -z "$STAGING_ALLOWED_EMAILS" ]; then
              echo "::error::Staging is never deployed without STAGING_ALLOWED_EMAILS (set MPC_STAGING_ALLOWED_EMAILS or MPC_OWNER_EMAIL)."
              exit 1
            fi
            args+=(--var "STAGING_ALLOWED_EMAILS:$STAGING_ALLOWED_EMAILS")
          fi
          # memo §7.2 Z3/Z4: the sign-in and email modes are always explicit, never left to a default
          if [ -z "$MAGIC_LINK" ] || [ -z "$LEARNER_EMAIL" ] || [ -z "$FROM_EMAIL" ]; then
            echo "::error::The configuration check gave no MAGIC_LINK, LEARNER_EMAIL or FROM_EMAIL."
            exit 1
          fi
          args+=(--var "MAGIC_LINK:$MAGIC_LINK" --var "LEARNER_EMAIL:$LEARNER_EMAIL" --var "FROM_EMAIL:$FROM_EMAIL")
          if [ -n "$LEGAL_NAME" ]; then args+=(--var "LEGAL_NAME:$LEGAL_NAME"); fi
          if [ -n "$GOOGLE_CLIENT_ID" ]; then args+=(--var "GOOGLE_CLIENT_ID:$GOOGLE_CLIENT_ID"); fi
          if [ -n "$MPC_MAILING_ADDRESS" ]; then args+=(--var "MAILING_ADDRESS:$MPC_MAILING_ADDRESS"); fi
          if [ -n "$MPC_OWNER_EMAIL" ]; then args+=(--var "OWNER_EMAIL:$MPC_OWNER_EMAIL"); fi
          if [ -n "$MPC_GRADER_MODEL" ]; then args+=(--var "GRADER_MODEL:$MPC_GRADER_MODEL"); fi
          if [ -n "$MPC_GRADER_EFFORT" ]; then args+=(--var "GRADER_EFFORT:$MPC_GRADER_EFFORT"); fi
          if [ -n "$MPC_GRADER_MAX_TOKENS" ]; then args+=(--var "GRADER_MAX_TOKENS:$MPC_GRADER_MAX_TOKENS"); fi
          if [ -n "$ANTHROPIC_LIMIT_USD" ]; then args+=(--var "ANTHROPIC_MONTHLY_LIMIT_USD:$ANTHROPIC_LIMIT_USD"); fi
          # deploy-config.ts gives both or neither (production only)
          if [ -n "$PREPAID_USD" ] && [ -n "$PREPAID_SINCE" ]; then
            args+=(--var "ANTHROPIC_PREPAID_USD:$PREPAID_USD" --var "ANTHROPIC_PREPAID_SINCE:$PREPAID_SINCE")
          fi
          if [ -n "$DOMAIN" ]; then args+=(--domain "$DOMAIN"); fi
          # From here on Cloudflare may change: the smoke test and the rollback check run even if this fails.
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          npx wrangler deploy "${args[@]}"

      # Runs whenever `wrangler deploy` was started, also when the Deploy step failed: wrangler makes the
      # new version live before it attaches routes, custom domains and crons, so a failure there can leave
      # new code serving.
      - name: Smoke test
        id: smoke
        if: ${{ !cancelled() && steps.secrets.outputs.ready == 'true' && steps.deploy.outputs.attempted == 'true' }}
        # in a rollback drill the smoke test is expected to fail; the rollback step then decides the result
        continue-on-error: ${{ env.DRILL == 'true' }}
        env:
          APP_VERSION: ${{ steps.deploy.outputs.app_version }}
          EXPECT_GOOGLE: ${{ steps.cfg.outputs.google_client_id != '' }}
          EXPECT_MAGIC_LINK: ${{ steps.cfg.outputs.magic_link }}
        # the new version can take a little while to reach every location; a drill asks for a version
        # that cannot exist, so the check fails after the new version is live. /api/me must report the
        # sign-in methods this deploy configured.
        run: |
          expect=(--expect-google "$EXPECT_GOOGLE" --expect-magic-link "$EXPECT_MAGIC_LINK")
          if [ "$DRILL" = true ]; then
            node scripts/run.mjs scripts/smoke.ts --base "$SITE_URL" --version "$APP_VERSION-drill" --wait-seconds 30 "${expect[@]}"
          else
            node scripts/run.mjs scripts/smoke.ts --base "$SITE_URL" --version "$APP_VERSION" --wait-seconds 120 "${expect[@]}"
          fi

      - name: Roll back if the deploy or the smoke test failed
        if: ${{ !cancelled() && steps.secrets.outputs.ready == 'true' && (steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure') }}
        env:
          PREV_VERSION: ${{ steps.prev.outputs.version }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          failed=""
          if [ "$DEPLOY_OUTCOME" = failure ]; then failed="Deploy"; fi
          if [ "$SMOKE_OUTCOME" = failure ]; then failed="${failed:+$failed + }Smoke test"; fi
          live_version() {
            local out
            out=$(npx wrangler deployments status --json -c worker/wrangler.jsonc "$WRANGLER_ENV_FLAG" 2>/dev/null) || return 0
            printf '%s' "$out" | node scripts/run.mjs scripts/deploy-config.ts live-version
          }
          live=$(live_version) || live=""
          echo "Failed step(s): $failed. Live $TARGET version now: ${live:-unknown}; before the deploy: ${PREV_VERSION:-none}"
          if [ -z "$PREV_VERSION" ]; then
            echo "::error::Failed step: $failed, on the first $TARGET deploy. There is no earlier Worker version to roll back to; fix the cause and deploy again."
            exit 1
          fi
          if [ "$live" = "$PREV_VERSION" ]; then
            if [ "$DRILL" = true ]; then
              echo "::error::Rollback drill inconclusive: the new version never went live (live is still $PREV_VERSION), so the rollback path was not exercised. Deploy a change and run the drill again."
              exit 1
            fi
            echo "::error::Failed step: $failed. The live $TARGET Worker is still version $PREV_VERSION (the new version never went live), so nothing was rolled back."
            echo "Failed step: $failed. $TARGET still serves $PREV_VERSION; no rollback needed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # the live version is new, or could not be read: go back to the version noted before the deploy
          if ! npx wrangler rollback "$PREV_VERSION" -y --message "$failed failed for ${GITHUB_SHA::7}" -c worker/wrangler.jsonc "$WRANGLER_ENV_FLAG"; then
            echo "::error::Failed step: $failed, and the rollback to $PREV_VERSION failed too. Roll back by hand: Cloudflare dashboard, Workers, the $TARGET Worker, Deployments; or npx wrangler rollback $PREV_VERSION (with --env staging for staging)."
            exit 1
          fi
          after=$(live_version) || after=""
          if [ "$DRILL" = true ]; then
            if [ "$DEPLOY_OUTCOME" = success ] && [ "$after" = "$PREV_VERSION" ]; then
              echo "Rollback drill passed: the smoke test failed on purpose and $TARGET was rolled back to $PREV_VERSION (live version re-read after the rollback)." >> "$GITHUB_STEP_SUMMARY"
              echo "::notice::Rollback drill passed: $TARGET rolled back to $PREV_VERSION."
              exit 0
            fi
            echo "::error::Rollback drill failed: deploy outcome $DEPLOY_OUTCOME, live version after the rollback '${after:-unknown}', expected $PREV_VERSION."
            exit 1
          fi
          if [ "$after" != "$PREV_VERSION" ]; then
            echo "::warning::After the rollback the live version reads as '${after:-unknown}', not $PREV_VERSION; check the Worker's Deployments page."
          fi
          echo "::error::Failed step: $failed. Rolled back the $TARGET Worker to version $PREV_VERSION. D1 migrations are not rolled back."
          echo "Failed step: $failed. Rolled back $TARGET to $PREV_VERSION (D1 migrations stay applied)." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: IndexNow ping (never fails the deploy)
        if: steps.smoke.outcome == 'success' && env.TARGET == 'production'
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ vars.MPC_INDEXNOW_KEY }}
        run: node scripts/run.mjs scripts/indexnow.ts ping --site "$SITE_URL" --sitemap out/sitemap.xml
