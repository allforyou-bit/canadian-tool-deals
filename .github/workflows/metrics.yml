# Daily aggregate metrics export (memo §5.2, B8, B11).
#
# Copies the newest `metrics_daily` rows (written by the Worker's 05:00 UTC cron) from D1 into
# ops/metrics/<day>.json, after a personal-data guard (no "@", no input_text / transcript / email /
# essay, no 16+ character token-like strings; every file under ops/metrics, recursively), and commits
# them as github-actions[bot]. That commit uses GITHUB_TOKEN, so it starts no other workflow.
# There is no ads check any more (memo §7.2 Z1: no ad budget; ops/metrics/ads.json and
# ops/config/ad-cap.json were removed).
# Outcome assertions, not job status: a missing snapshot or a failed export opens an issue and fails the
# run (GitHub's failed-run email is the second alert). Scheduled runs can start late — the memo notes
# delays of up to 11.9 h — so the export takes the newest 3 rows and is idempotent.
# Without the Cloudflare secrets the run stops after its first step (a notice, no install), so it costs
# almost no Actions minutes before the owner has set them up.
name: Daily metrics

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: products/clb
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check secrets
        id: cfg
        # before the checkout, so products/clb does not exist yet
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Metrics export skipped: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Set up Node
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/clb/package-lock.json

      - name: Install
        if: steps.cfg.outputs.ready == 'true'
        run: npm ci

      - name: Export metrics_daily rows
        id: export
        if: steps.cfg.outputs.ready == 'true'
        run: |
          set +e
          node scripts/run.mjs scripts/metrics.ts export --dir ../../ops/metrics --days 3
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 = fresh, 3 = written but the newest row is older than yesterday; anything else is an error
          if [ "$code" != 0 ] && [ "$code" != 3 ]; then exit "$code"; fi

      - name: Personal-data guard
        id: guard
        if: always() && steps.cfg.outputs.ready == 'true'
        run: node scripts/run.mjs scripts/metrics.ts guard ../../ops/metrics

      - name: Commit new metrics files
        if: steps.cfg.outputs.ready == 'true' && steps.export.outcome == 'success' && steps.guard.outcome == 'success'
        working-directory: .
        run: |
          git add -A -- ops/metrics/
          if git diff --cached --quiet; then
            echo "No metrics changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(metrics): daily aggregate export $(date -u +%F)"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            echo "push rejected (attempt $attempt); rebasing on the remote branch"
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          echo "::error::Could not push the metrics commit."
          exit 1

      - name: Open an issue for a missing snapshot or a failed export
        if: always() && steps.cfg.outputs.ready == 'true' && (steps.export.outcome == 'failure' || steps.guard.outcome == 'failure' || steps.export.outputs.code == '3')
        uses: actions/github-script@v9
        env:
          EXPORT_FAILED: ${{ steps.export.outcome == 'failure' }}
          GUARD_FAILED: ${{ steps.guard.outcome == 'failure' }}
          EXPORT_CODE: ${{ steps.export.outputs.code }}
          SNAPSHOT_STALE: ${{ steps.export.outputs.code == '3' }}
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const wanted = []
            if (process.env.EXPORT_FAILED === 'true') {
              wanted.push({
                title: 'Metrics export failed',
                body: `The daily D1 export (\`scripts/metrics.ts export\`) failed${process.env.EXPORT_CODE ? ` with exit code ${process.env.EXPORT_CODE}` : ''}: a wrangler or Cloudflare API error (for example an expired CLOUDFLARE_API_TOKEN), an invalid metrics_daily row, or a personal-data guard hit. Nothing was committed for the failed rows.\n\nSee the run log (it names the rule and position only, never the data): ${run}`,
              })
            }
            if (process.env.GUARD_FAILED === 'true') {
              wanted.push({
                title: 'Personal-data guard failed on ops/metrics',
                body: `\`scripts/metrics.ts guard\` found a file under ops/metrics that is not allowed or may hold personal data (the log names the file, rule and position only). Nothing was committed by this run. Do not edit the file by hand to make the check pass: find out how the data got there (ops/metrics/README.md).\n\nRun: ${run}`,
              })
            }
            if (process.env.SNAPSHOT_STALE === 'true') {
              wanted.push({
                title: 'Metrics snapshot missing',
                body: `The newest \`metrics_daily\` row in D1 is older than yesterday (UTC), so the Worker's 05:00 UTC cron did not write one.\n\nCheck the Worker's logs in the Cloudflare dashboard and the cron trigger. Run: ${run}`,
              })
            }
            const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', per_page: 100 })
            for (const w of wanted) {
              const existing = open.find((i) => !i.pull_request && i.title === w.title)
              if (existing) {
                await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: `Still happening on ${new Date().toISOString().slice(0, 10)}. ${run}` })
              } else {
                await github.rest.issues.create({ ...context.repo, title: w.title, body: w.body })
              }
            }

      - name: Fail when an assertion failed
        if: always() && steps.export.outputs.code == '3'
        run: |
          echo "::error::The metrics snapshot for yesterday is missing; see the issue opened by this run."
          exit 1
