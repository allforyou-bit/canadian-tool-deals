# Daily Stripe ↔ D1 reconciliation (memo §5.2): every paid Checkout Session of the last 3 days must
# match a D1 purchase that was granted, and every D1 purchase that took money must match a paid
# session. Any mismatch opens (or comments on) an issue and fails the run. Logic and tests:
# products/clb/scripts/reconcile-core.ts, reconcile.test.ts. Only ids and amounts leave the script.
name: Reconcile payments

on:
  schedule:
    - cron: '43 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: products/clb
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      # production site: sessions whose success_url is on another host (staging) are left out
      SITE_URL: ${{ vars.MPC_SITE_URL }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check secrets
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "::notice::Reconciliation skipped: needs the CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and STRIPE_SECRET_KEY repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: products/clb/package-lock.json

      - name: Install
        if: steps.cfg.outputs.ready == 'true'
        run: npm ci

      - name: Reconcile the last 3 days
        id: rec
        if: steps.cfg.outputs.ready == 'true'
        continue-on-error: true
        run: node scripts/run.mjs scripts/reconcile.ts --days 3 --out "$RUNNER_TEMP/reconcile"

      - name: Open or update the mismatch issue
        if: steps.cfg.outputs.ready == 'true' && steps.rec.outputs.mismatches != '' && steps.rec.outputs.mismatches != '0'
        uses: actions/github-script@v9
        env:
          ISSUE_FILE: ${{ runner.temp }}/reconcile/issue.md
        with:
          script: |
            const fs = require('fs')
            const title = 'Payment reconciliation mismatch'
            const body = fs.readFileSync(process.env.ISSUE_FILE, 'utf8')
            const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', per_page: 100 })
            const existing = open.find((i) => !i.pull_request && i.title === title)
            if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body })
            else await github.rest.issues.create({ ...context.repo, title, body })

      - name: Fail on mismatch or error
        if: steps.cfg.outputs.ready == 'true' && steps.rec.outcome == 'failure'
        run: |
          echo "::error::Reconciliation found mismatches or could not run; see the log and the issue."
          exit 1
